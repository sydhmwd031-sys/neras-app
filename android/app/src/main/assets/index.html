<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}*{-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none}</style>
</head><body>
<title>نراس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Marcellus&display=swap">
<style>
/* Layout: one calm column; child mode = big icon tiles, parent mode = tabbed reading; a quiet sage world, low visual noise */
/* Neras brand: cream paper, deep teal ink, soft teal + gold from the logo */
:root{
  --bg:#FBF8F2; --surface:#FFFFFF; --surface-2:#F3EDE1; --ink:#123F3C; --muted:#5E6E6A;
  --accent:#23807B; --accent-ink:#FFFFFF; --accent-soft:#DCEFEC; --sun:#D9A441; --line:#E7DDCA;
  --ok:#2F8A52; --ok-soft:#DCF0E2; --try:#9A6512; --try-soft:#FAEED6; --parent:#0F4E4A; --parent-soft:#E2EEEB; --gold:#C8962E; --gold-soft:#F7ECD3;
  --display:"Almarai","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --latin:"Marcellus",Georgia,serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A19; --surface:#172524; --surface-2:#1E302E; --ink:#EAF1EE; --muted:#9FB3AE;
  --accent:#5EC2BB; --accent-ink:#0B1615; --accent-soft:#1C3A37; --sun:#EBC264; --line:#2A3D3A;
  --ok:#6CCB8E; --ok-soft:#1C3527; --try:#E9B55C; --try-soft:#3A2E17; --parent:#8FD3C9; --parent-soft:#1D3532; --gold:#E7BE64; --gold-soft:#3A3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A19; --surface:#172524; --surface-2:#1E302E; --ink:#EAF1EE; --muted:#9FB3AE;
  --accent:#5EC2BB; --accent-ink:#0B1615; --accent-soft:#1C3A37; --sun:#EBC264; --line:#2A3D3A;
  --ok:#6CCB8E; --ok-soft:#1C3527; --try:#E9B55C; --try-soft:#3A2E17; --parent:#8FD3C9; --parent-soft:#1D3532; --gold:#E7BE64; --gold-soft:#3A3020; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.app{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:24px;font-weight:800;color:var(--parent)}
.brand img{width:46px;height:auto;flex:none}
.brand .lt{font-family:var(--latin);font-size:15px;color:var(--gold);margin-inline-start:6px;font-weight:400}
.brand small{display:block;color:var(--muted);font-size:13px;margin-top:-4px}
.tools{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums}
.pill .st{color:var(--sun)}
.pill.pop{animation:pop .5s ease}
@keyframes pop{50%{transform:scale(1.15)}}
.lockbtn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none}
.lockbtn svg.prog{position:absolute;inset:-3px;width:50px;height:50px;transform:rotate(-90deg);pointer-events:none}
.lockbtn svg.prog circle{fill:none;stroke:var(--parent);stroke-width:4;stroke-dasharray:145;stroke-dashoffset:145}
.lockbtn.hold svg.prog circle{transition:stroke-dashoffset 1.5s linear;stroke-dashoffset:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:90vw;text-align:center}

.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;background:var(--surface-2);padding:6px;border-radius:16px}
.tabs button{border:0;background:transparent;border-radius:12px;padding:10px 2px;font-weight:600;color:var(--muted);font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--parent);box-shadow:0 1px 3px rgb(0 0 0 / .08)}

.intro{color:var(--muted);max-width:62ch}
.sub{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ktile{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px 10px;text-align:center;transition:transform .15s}
.ktile:hover{transform:translateY(-2px);border-color:var(--accent)}
.ktile .ic{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);font-size:42px;line-height:1}
.ktile h3{font-size:21px}
.ktile.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:16px;background:var(--accent-soft);border-color:transparent}
.ktile.wide .ic{background:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:18px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.back{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 18px;font-weight:600}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.prompt{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-size:clamp(22px,5vw,30px);font-weight:700;text-align:center}
.say{border:0;background:var(--accent-soft);color:var(--accent);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.opts.txt{grid-template-columns:1fr}
.opt{border:3px solid var(--line);background:var(--surface);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:120px;justify-content:center;transition:border-color .2s,background .2s}
.opts.txt .opt{min-height:0;font-weight:600;font-size:18px;padding:12px 16px;flex-direction:row;justify-content:flex-start;gap:14px;text-align:start}
.oem{font-size:42px;line-height:1;flex:none;width:56px;height:56px;display:grid;place-items:center;background:var(--surface-2);border-radius:16px}
.pips{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:90px}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .lbl{font-weight:600;font-size:17px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.try{border-color:var(--try);background:var(--try-soft);opacity:.6}
.opt:disabled{cursor:default}
.swatch{display:grid;place-items:center;font-size:34px;width:72px;height:72px;border-radius:50%;border:3px solid rgb(0 0 0 / .08)}
.numbig{font-family:var(--display);font-size:44px;font-weight:800;line-height:1}
.objs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;font-size:44px;line-height:1;padding:12px;background:var(--surface-2);border-radius:20px;min-height:80px}
.scene{background:var(--accent-soft);border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;font-size:20px;font-weight:600}
.scene .em{font-size:52px;line-height:1;flex:none}
.fb{min-height:56px;border-radius:16px;padding:12px 16px;text-align:center;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.try{background:var(--try-soft);color:var(--try)}
.fb .tip{display:block;font-weight:500;color:var(--ink);width:100%}
.main{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:12px 28px;font-weight:700;font-size:18px;font-family:var(--display)}
.main.p{background:var(--parent);color:var(--bg)}
.main:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:10px 22px;font-weight:600}
.danger{border:1px solid var(--try);background:var(--try-soft);color:var(--try);border-radius:999px;padding:10px 22px;font-weight:600}
.done{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:20px 0}
.done .big{font-size:56px;line-height:1;color:var(--sun);letter-spacing:.1em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent)}

.mem{display:grid;gap:10px;margin:0 auto;width:100%}
.card{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:16px;background:var(--accent);display:grid;place-items:center;transition:background .25s}
.card span{opacity:0;transition:opacity .2s;display:grid;place-items:center;width:100%}
.card.open,.card.got{background:var(--surface-2)}
.card.open span,.card.got span{opacity:1}
.card.got{outline:3px solid var(--ok)}
.card::after{content:"؟";font-family:var(--display);font-size:30px;color:var(--accent-ink);position:absolute}
.card.open::after,.card.got::after{content:""}

.strip{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:18px;padding:12px 16px;min-height:72px;font-family:var(--display);font-size:24px;font-weight:700}
.strip .em{font-size:40px;line-height:1}
.aac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.aac button{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:16px}
.aac button .em{font-size:40px;line-height:1}
.aac button.on{border-color:var(--accent);background:var(--accent-soft)}

.now{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--accent-soft);border-radius:22px;padding:22px;text-align:center}
.now .tag{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.now .em{font-size:72px;line-height:1}
.now h3{font-size:26px}
.next{color:var(--muted);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.step{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;text-align:center}
.step .em{font-size:30px;line-height:1}
.step.d{opacity:.45;border-style:dashed}
.step.c{border-color:var(--accent)}
.step .ck{color:var(--ok);font-size:12px}

.breath{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
.ring{width:min(240px,70vw);aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--accent-soft) 0 55%,transparent 56%)}
.orb{width:45%;aspect-ratio:1;border-radius:50%;background:var(--accent);transition:transform 4s ease-in-out;display:grid;place-items:center;color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:20px}
.orb.in{transform:scale(1.9)}

/* onboarding + parent */
.ob{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:18px}
.obbar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.obbar i{display:block;height:100%;background:var(--parent);border-radius:99px;transition:width .3s}
.eyebrow{font-size:13px;font-weight:600;color:var(--parent);letter-spacing:.02em}
.ob h2{font-size:26px}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;text-align:start;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px}
.choice .em{font-size:30px;line-height:1;flex:none;width:40px;text-align:center}
.choice b{display:block;font-size:17px}
.choice span.d{display:block;font-size:14px;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--parent);background:var(--parent-soft)}
.field{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:18px}
.obnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.role{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:460px){.role{grid-template-columns:1fr}}
.rolebtn{display:flex;flex-direction:column;align-items:center;gap:10px;border:2px solid var(--line);background:var(--surface);border-radius:24px;padding:26px 14px;text-align:center}
.rolebtn .em{font-size:64px;line-height:1}
.rolebtn h2{font-size:26px}
.rolebtn.kid{border-color:var(--accent);background:var(--accent-soft)}
.rolebtn.par h2{color:var(--parent)}

.pad{display:flex;flex-direction:column;align-items:center;gap:16px}
.pdots{display:flex;gap:14px;direction:ltr}
.pdots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--parent)}
.pdots i.f{background:var(--parent)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px;direction:ltr}
.keys button{height:64px;border-radius:18px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--display);font-size:26px;font-weight:700}
.err{color:var(--try);font-weight:600;min-height:1.6em;text-align:center}
.linkbtn{border:0;background:none;color:var(--parent);font-weight:600;text-decoration:underline;padding:4px}

.plan{display:flex;flex-direction:column;gap:14px}
.hero{background:var(--parent-soft);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.hero h2{font-size:24px;color:var(--parent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.focus{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.focus h3{font-size:20px;display:flex;align-items:center;gap:10px}
.focus h3 .em{font-size:26px}
.focus dl{margin:0;display:grid;gap:8px}
.focus dt{font-size:13px;font-weight:600;color:var(--parent)}
.focus dd{margin:0;max-width:66ch}
.tips{display:flex;flex-direction:column;gap:10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:19px;font-weight:700}
summary::-webkit-details-marker{display:none}
summary .n{flex:none;width:36px;height:36px;border-radius:12px;background:var(--parent-soft);display:grid;place-items:center;font-size:18px}
summary::after{content:"+";margin-inline-start:auto;color:var(--parent);font-size:24px}
details[open] summary::after{content:"−"}
details ul{margin:0;padding:0 18px 18px;padding-inline-start:38px;display:flex;flex-direction:column;gap:8px;max-width:68ch}
details li strong{color:var(--parent)}
.sit{padding:0 18px 18px;display:grid;gap:12px}
.sit div b{display:block;font-size:13px;color:var(--parent)}
.note{background:var(--try-soft);border-radius:var(--r);padding:14px 18px;font-size:15px}
.note strong{color:var(--try)}
.setlist{display:grid;gap:10px}
.setitem{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.setitem p{font-weight:600}
.brandhero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 0 4px}
.brandhero img{width:120px;height:auto}
.brandhero .wm{font-family:var(--latin);font-size:34px;color:var(--parent);line-height:1}
.brandhero h1{font-size:20px;color:var(--parent)}
.goldrule{width:64px;height:3px;border-radius:3px;background:var(--gold)}
.svc{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.svc span{background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.ctc{display:grid;gap:10px}
.ctcrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;flex-wrap:wrap}
.ctcrow .ico{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--parent)}
.ctcrow .v{flex:1;min-width:0}
.ctcrow .v small{display:block;color:var(--muted);font-size:12px}
.ctcrow .v b{display:block;direction:ltr;text-align:right;unicode-bidi:plaintext;font-family:var(--latin);font-size:17px;font-weight:400;overflow-wrap:anywhere;user-select:all}
.ctcrow .acts{display:flex;gap:6px;flex-basis:100%;padding-inline-start:54px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink)}
a.mini{display:inline-flex;align-items:center}
.cta{background:var(--gold-soft);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.cta h3{font-size:19px;color:var(--parent)}
.msgbox{white-space:pre-wrap;background:var(--surface);border:1px dashed var(--gold);border-radius:14px;padding:12px 14px;font-size:15px}
.stage{position:relative;border-radius:26px;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 1px var(--line)}
.stage canvas{display:block;width:100%;height:min(64vh,560px);cursor:pointer}
.stg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stg button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.stg button span{font-size:24px}
.stg button small{font-size:11px;color:var(--muted);font-weight:600}
.stg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.clr{position:absolute;top:12px;left:12px;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:26px;display:grid;place-items:center;box-shadow:0 2px 8px rgb(0 0 0 / .25)}
.ktile.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--accent-soft),var(--gold-soft));border-color:transparent;padding:22px 10px}
.ktile.hero .ic{width:96px;height:96px;font-size:56px;background:var(--surface);border-radius:50%}
@media (max-width:560px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--display);font-size:20px;color:var(--parent)}
.stats span{font-size:13px;color:var(--muted)}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ins li{display:flex;gap:10px;align-items:flex-start}
.ins li>span{flex:none;width:34px;height:34px;border-radius:10px;background:var(--parent-soft);display:grid;place-items:center}
.ins b{color:var(--parent)}
.bars{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bt{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bv{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px}
.wb{height:90px;width:100%;max-width:28px;background:var(--surface-2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wb i{display:block;width:100%;background:var(--gold);border-radius:8px}
.week small{font-size:11px;color:var(--muted)}
.chip.lk{background:var(--gold-soft)}
.chip small{color:var(--muted)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto 80px 3em;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.prow:first-of-type{border-top:0}
.lvl{font-size:12px;font-weight:600;background:var(--parent-soft);color:var(--parent);border-radius:99px;padding:2px 10px}
.acc{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.acc i{display:block;height:100%;background:var(--ok)}
@media (prefers-reduced-motion:reduce){.ktile,.pill.pop,.obbar i{transition:none;animation:none}}

function actStart(a,extra){actEnd();cur=Object.assign({a,t:Date.now(),taps:0,ok:0,wrong:0,help:0},extra||{})}
function actEnd(){if(!cur)return;cur.d=Math.round((Date.now()-cur.t)/1000);if(cur.d>=3){LOG.ev.push(cur);if(LOG.ev.length>800)LOG.ev=LOG.ev.slice(-800);saveLog()}cur=null}
const mark=(k,n=1)=>{if(cur)cur[k]=(cur[k]||0)+n};
function like(w,e){const l=LOG.likes[w]||(LOG.likes[w]={n:0,e:e||''});l.n++;if(e)l.e=e;saveLog()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){actEnd();store.set('nr_log',LOG)}});
const adj=k=>(LOG.adapt[k]&&LOG.adapt[k].d)||0;
const OP=k=>Math.max(2,Math.min(4,lv().opts+adj(k)));
const MC=()=>Math.max(3,Math.min(10,lv().maxCount+adj('count')*2));
function adaptBy(k,acc,lo=-2,hi=2){const a=LOG.adapt[k]||(LOG.adapt[k]={d:0,hist:[]});a.hist.push(Math.round(acc*100));if(a.hist.length>12)a.hist.shift();
 let dir=0;if(acc>=.85&&a.d<hi)dir=1;else if(acc<=.5&&a.d>lo)dir=-1;
 if(dir){a.d+=dir;LOG.chg.push({t:Date.now(),k,dir,acc:Math.round(acc*100)});if(LOG.chg.length>30)LOG.chg.shift()}saveLog();return dir}
function topLikes(n){return Object.entries(LOG.likes).sort((a,b)=>b[1].n-a[1].n).slice(0,n)}
function pickWord(list,not){const fav=topLikes(8).map(x=>x[0]);const L=list.filter(w=>w!==not);const pool=L.filter(w=>fav.includes(w[1]));return pool.length&&Math.random()<.55?pick(pool):pick(L)}
function scores(days=14){const now=Date.now(),s={};LOG.ev.forEach(e=>{const age=(now-e.t)/864e5;if(age>days)return;const k=e.a.split(':')[0];s[k]=(s[k]||0)+(e.d<15?-20:Math.min(e.d,600))*Math.exp(-age/7)});return s}
function bestScene(){const s={};LOG.ev.forEach(e=>{if(e.a.startsWith('free:')&&Date.now()-e.t<14*864e5){const k=e.a.slice(5);s[k]=(s[k]||0)+(e.d<15?-20:e.d)}});const b=Object.entries(s).sort((a,b)=>b[1]-a[1])[0];return b&&b[1]>0?b[0]:null}

function pinPad(host,label,onFull){let v='';
 function draw(msg,lbl){host.innerHTML=`<div class="pad"><p style="font-weight:600">${lbl||label}</p><div class="pdots">${[0,1,2,3].map(i=>`<i class="${i<v.length?'f':''}"></i>`).join('')}</div><div class="err">${msg||''}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}" aria-label="${k==='⌫'?'مسح':k}">${k==='⌫'?'⌫':AR(k)}</button>`).join('')}</div></div>`;
  host.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=k;
   if(v.length===4){const r=onFull(v);const val=v;v='';if(r==='again')return draw('','أعد كتابة الرمز للتأكيد');if(r==='mismatch')return draw('الرمزين مختلفين، جرّب من جديد');if(r==='wrong')return draw('الرمز غير صحيح');if(r==='ok')return;v=val}
   draw('',host._lbl)})}
 draw()}

/* ---------- round-based game engine ---------- */
function runGame(cfg,key){let r=0,first=0,wrongThis=false;const R=lv().rounds;let panel;
 const head=()=>`<div class="phead"><button class="back" data-home>→ الألعاب</button><div class="dots">${Array.from({length:R},(_,i)=>`<i class="${i<r?'on':''}"></i>`).join('')}</div></div>`;
 function round(){hush();
  if(r>=R){panel=kidPanel(head()+`<div class="done"><div class="big">★★★</div><h2>أحسنت يا ${esc(profile.name)}!</h2><p class="sub">جمعت ${AR(R)} نجوم. خذ استراحة أو العب مرة ثانية.</p><div class="row"><button class="main" data-again>مرة ثانية</button><button class="ghost" data-home>كل الألعاب</button></div></div>`);say('أحسنت يا '+profile.name);adaptBy(key,first/R);panel.querySelector('[data-again]').onclick=()=>{r=0;first=0;actStart(key);round()};return}
  const q=cfg.make();wrongThis=false;
  panel=kidPanel(head()+(q.top||'')+`<div class="prompt"><span>${q.prompt}</span><button class="say" aria-label="اسمع السؤال">${spk}</button></div><div class="opts ${q.text?'txt':''}">${q.options.map((o,i)=>`<button class="opt" data-i="${i}" aria-label="${esc(o.label)}">${o.html}</button>`).join('')}</div><div class="fb" aria-live="polite"></div>`);
  const fb=panel.querySelector('.fb');
  panel.querySelector('.say').onclick=()=>say(q.speak||q.prompt);
  setTimeout(()=>say(q.speak||q.prompt),250);
  panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=q.options[+b.dataset.i];
   if(o.correct){if(!wrongThis){first++;mark('ok')}else mark('help');b.classList.add('ok');panel.querySelectorAll('.opt').forEach(x=>x.disabled=true);chime(true);addStar();r++;panel.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<r));
    fb.className='fb ok';fb.innerHTML=`<span>أحسنت! ★</span>${q.after?`<span class="tip">${q.after}</span>`:''}<button class="main" data-next>التالي ←</button>`;say('أحسنت! '+o.label+'. '+(q.after||''));fb.querySelector('[data-next]').onclick=round}
   else{wrongThis=true;mark('wrong');b.classList.add('try');b.disabled=true;chime(false);fb.className='fb try';fb.textContent='قريب! جرّب مرة ثانية';say('جرّب مرة ثانية')}})}
 round()}

 const cv=$('#pw'),ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);let W=0,H=0;
 function size(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
 size();
 const EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
 const AF='Almarai,"IBM Plex Sans Arabic",sans-serif';
 const rnd=(a,b)=>a+Math.random()*(b-a);
 let lastSay=0;const sayT=t=>{const n=performance.now();if(n-lastSay>1300){lastSay=n;say(t)}};
 const vol=profile.sens==='high'?.35:profile.sens==='some'?.7:1;
 function tone(f,d=.5,type='triangle',v=.12,slide){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d*.6);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*vol,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
 const PENTA=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880,1046.5];
 let parts=[];
 function spark(x,y,hue,n,sp=1,grav=80){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(40,170)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,hue:hue+rnd(-15,15),r:rnd(2,5),g:grav})}}
 function drawParts(dt){parts.forEach(p=>{p.life-=dt*1.2;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.98;if(p.life<=0)return;ctx.globalAlpha=p.life;ctx.fillStyle=`hsl(${p.hue},95%,65%)`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life+.8,0,6.283);ctx.fill()});parts=parts.filter(p=>p.life>0);ctx.globalAlpha=1}

 function emoji(e,x,y,s,flip,rot){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.font=`${s}px ${EF}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,0,0);ctx.restore()}

 function drawStars(t,maxY=1){ctx.fillStyle='#fff';stars.forEach(s=>{if(s.y>maxY)return;ctx.globalAlpha=.25+.45*(.5+.5*Math.sin(t*1.5+s.p));ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill()});ctx.globalAlpha=1}

  const t=ac.currentTime,src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();src.buffer=nbuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(v*vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);src.connect(f).connect(g).connect(ac.destination);src.start(t,Math.random()*.3);src.stop(t+dur+.02)}catch(e){}}

 if(scKind==='sand'){
  const top=document.createElement('canvas');let tctx,tr=[],found=0,lastP={},crunchD=0,done=0;
  const TREAS=[['🚗','سيارة'],['🐚','صدفة'],['⭐','نجمة'],['🔑','مفتاح'],['🦖','ديناصور'],['🏀','كرة'],['💎','جوهرة'],['🐢','سلحفاة'],['🥄','ملعقة'],['🦀','سرطان البحر']];
  function cover(){tctx.globalCompositeOperation='source-over';const g=tctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ecd29b');g.addColorStop(1,'#d9b475');tctx.fillStyle=g;tctx.fillRect(0,0,W,H);

  sc.init=()=>{top.width=W*dpr;top.height=H*dpr;tctx=top.getContext('2d');tctx.setTransform(dpr,0,0,dpr,0,0);cover();hide()};
  function dig(x,y,r){tctx.save();tctx.globalCompositeOperation='destination-out';const g=tctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,.9)');g.addColorStop(.6,'rgba(0,0,0,.5)');g.addColorStop(1,'rgba(0,0,0,0)');tctx.fillStyle=g;tctx.beginPath();tctx.arc(x,y,r,0,6.283);tctx.fill();tctx.restore();
   for(let i=0;i<3;i++)parts.push({x,y,vx:rnd(-90,90),vy:rnd(-160,-60),life:.9,hue:35,r:rnd(1.5,3.5),g:500})}
  function check(){tr.forEach(t=>{if(t.got)return;let a=255;try{a=tctx.getImageData(t.x*dpr,t.y*dpr,1,1).data[3]}catch(e){}

    if(found===tr.length){done=3.2;chime(true)}}})}

  let cols=6,rows=8,vtx=[],cells=[],pieces=[],sheet=null,left=0,reveal=0,lastTear=0,lastP={},si=0,slide=0;
  function newSheet(){const m=Math.min(W,H);cols=W>H?9:6;rows=W>H?6:8;const pw=W*.86,ph=H*.86,x0=(W-pw)/2,y0=(H-ph)/2,cw=pw/cols,ch=ph/rows;
   vtx=[];for(let j=0;j<=rows;j++){const row=[];for(let i=0;i<=cols;i++){const edge=i===0||j===0||i===cols||j===rows;row.push({x:x0+i*cw+(edge?0:rnd(-.28,.28)*cw),y:y0+j*ch+(edge?0:rnd(-.28,.28)*ch)})}vtx.push(row)}

   const c=COLS[si++%COLS.length],w=pickWord(WORDS);sheet={col:c[0],cn:c[1],e:w[0],n:w[1],x0,y0,pw,ph};reveal=0;slide=1;sayT('ورقة '+c[1])}

/* ---------- Bubble World: errorless learning for children who can't read or focus yet ----------
   Stage 1 touch: any touch is rewarded (cause and effect)

const SITU=[
 ['🙅','يرفض أي طلب وينهار لو أجبرته',['قبلها','انتبه للعلامات: يغطي أذنه، يكثر الحركة أو الصراخ، يهرب، أو يعض يده. أول ما تشوفها وقّف الطلب فوراً وخفّف الصوت والضوء والناس.'],['وقتها','الانهيار مو عناد ولا دلع؛ جهازه العصبي ما عاد يتحمّل. لا تجبره ولا تمسكه بالقوة إلا للسلامة. كلام أقل ما يمكن، صوت هادي، أعطه مساحة، أبعد الأشياء الخطرة، وانتظر معه.'],['بعدها','أعطه وقت يرتاح، ممكن يحتاج ينام أو يجلس لحاله. لا عقاب ولا محاضرة. بعدين فكّر: وش الطلب أو المكان اللي ضغط عليه؟ وخفّفه المرة الجاية.'],['تنبيه','لو تشنّج جسمه فعلاً (رجفة أو تصلّب أو غاب عن الوعي) فهذي ممكن تكون نوبة صرع، وهي أكثر عند أطفال التوحد. وقتها مدّده على جنبه، وأبعد الأشياء عنه، ولا تحط شي في فمه. واتصل بالإسعاف ٩٩٧ لو طوّلت أكثر من ٥ دقائق أو كانت أول مرة، وراجع الطبيب.']],

const TIPS=[
 ['🏖️','طفل يحب التراب وتقطيع الأكياس',['هذي غالباً <strong>هوايات حسية</strong>: يدوّر على إحساس اللمس وصوت التقطيع لأنها تريّحه وتنظّمه. لا تحاول تمنعها كلياً؛ حوّلها لشي آمن.','<strong>بدائل آمنة للتقطيع:</strong> ورق جرايد، ورق مناديل، ورق كرافت، كرتون خفيف، أو ورق فقاعات تحت إشرافك.','<strong>بدائل للتراب:</strong> صندوق رمل نظيف، أو رز أو عدس في صينية كبيرة، أو رمل حركي (Kinetic sand).','⚠️ <strong>الأكياس البلاستيك خطر اختناق.</strong> لا تتركه معها لحاله، ولا تخليه يحطها على وجهه أو رأسه، وخزّنها بعيد عن يده.','لو يحط التراب أو الورق في فمه كثير، كلّم الطبيب؛ أحياناً يكون السبب نقص حديد أو حالة اسمها «بيكا» ولها علاج.','<strong>علّمه من خلالها:</strong> خبّي ألعاب في الرمل وسمّها لما يلقاها، قطّعوا ورق ملوّن وسمّوا الألوان، واستخدمها كمكافأة: «أولاً نلبس، ثم نقطّع ورق».','في التطبيق: قسم <strong>الرمل</strong> (يحفر ويلقى كنوز) وقسم <strong>قطّع</strong> (يقطّع الورق ويطلع تحته صورة) داخل «العب براحتك».']],
 ['🕊️','طفلي ما يتحمّل الأوامر',['<strong>قلّل الطلبات:</strong> اكتب كل الأوامر اللي تقولها في يوم واحد، واترك الضروري فقط (السلامة، الأكل، النوم، العلاج). الباقي أجّله أو تنازل عنه.','<strong>تكلّم بدون أمر:</strong> بدل «البس حذاءك» قل «الحذاء عند الباب». وبدل «تعال كُل» قل «الغداء جاهز على الطاولة».','<strong>خلّ الجدول هو اللي يطلب:</strong> «الجدول يقول: وقت الحمام» بدل «أنا قلت لك».','<strong>خيارين داخل حدود:</strong> «تبغى الكوب الأزرق أو الأحمر؟» يعطيه إحساس بالتحكم.','<strong>حوّل الطلب للعب:</strong> سباق للحمام، الأغراض تتكلم، أو اربطه بشي يحبه.','<strong>هدوءك ينتقل له:</strong> صوت منخفض وحركة بطيئة. الهدف الأول إنه يبقى هادي وآمن، مو إنه ينفّذ. الطفل الهادي يتعلّم، والخايف ما يتعلّم.']],
 ['💬','التواصل',['استخدم <strong>جمل قصيرة وواضحة</strong>: «البس الحذاء» بدل الشرح الطويل.','<strong>انتظر ٥–١٠ ثواني</strong> بعد السؤال قبل ما تعيده.','ادعم كلامك <strong>بالصور والإشارة</strong>.','<strong>اتبع اهتمامه</strong>: لو يحب السيارات، علّمه الألوان والأرقام بالسيارات.']],
 ['🌱','السلوك',['اسأل: <strong>وش صار قبل السلوك؟</strong> غالباً فيه سبب.','<strong>امدح الشي المحدد</strong>: «أحسنت إنك انتظرت» أفضل من «شاطر».','<strong>أعطه خيارين</strong> يعطيه شعور بالتحكم.','وقت الانهيار الحسي <strong>لا تعاقب</strong>. خفف المؤثرات وتكلم بعدين.']],
 ['📱','استخدام التطبيق',['<strong>العب مع طفلك</strong>؛ لا تتركه وحده مع الشاشة.','جلسة <strong>١٠–١٥ دقيقة</strong> كافية، وكرّر الألعاب نفسها؛ التكرار يريحه ويعلّمه.','انقل اللي تعلّمه في التطبيق للحياة: سمِّ الألوان والمشاعر في البيت.']],
 ['🩺','متى تطلب مختص',['<strong>التدخل المبكر</strong> هو أكثر شي يفرق.','الفريق المعتاد: <strong>طبيب أطفال نمائي</strong>، <strong>أخصائي تخاطب</strong>، <strong>علاج وظيفي</strong>، وبرامج <strong>تعديل السلوك</strong>.','راجع الطبيب لو ما يلتفت لاسمه، ما يشير، تأخر كلامه، أو فقد كلمات كان يقولها.']],
 ['💚','لك أنت',['اهتم براحتك؛ الأهل المرتاحين يعطون أكثر.','تواصل مع <strong>أسر أطفال التوحد</strong> والجمعيات المحلية.','احتفل بالخطوات الصغيرة.']]

  <article class="focus"><h3><span class="em">🎨</span>العب براحتك: تعلّم بدون أوامر</h3><dl><div><dt>لمين؟</dt><dd>للطفل اللي ما يلتزم، ويرفض أو يتضايق لو طلبنا منه شي. هنا ما فيه سؤال ولا صح وغلط ولا وقت. هو يختار وش يلمس، والجوال يسمّي كل شي يلمسه: الألوان والحيوانات والأسماك والأصوات.</dd></div><div><dt>الأقسام</dt><dd>⛱️ الرمل (يحفر ويلقى كنوز ويسمع اسمها) · 📄 قطّع (يقطّع ورق ملوّن بصوت حقيقي وتحته صورة) · 🖌️ الرسم بالأصبع (الألوان) · 🐠 البحر (أسماك وحيوانات البحر) · 🐮 المزرعة (حيوانات، فراشة، شمس) · 🎵 الموسيقى (نغمات هادئة دايماً حلوة).</dd></div><div><dt>دورك</dt><dd>اجلس جنبه بدون ما تطلب شي. قلّد اللي يسويه، وقل الكلمة بعد الجوال بصوت هادي («بقرة!»). لو التفت لك أو ابتسم أو لمس يدك، هذا تواصل حقيقي ويستاهل الفرح. هذا أسلوب «اتبع قيادة الطفل» (Floortime)، و١٥–٢٠ دقيقة يومياً تفرق.</dd></div></dl></article>
  <article class="focus"><h3><span class="em">🫧</span>عالم الفقاعات: التعلم بدون أخطاء</h3><dl><div><dt>لمين؟</dt><dd>للطفل اللي ما يركز وما يفهم التعليمات وما يقرأ. كل شي فيها صور وصوت، وما فيها خسارة أبداً.</dd></div><div><dt>المراحل</dt><dd><ul style="margin:0;padding-inline-start:20px"><li><b>🫧 المس:</b> أي لمسة تفرقع فقاعة. يتعلم إن لمسته تسوي شي (السبب والنتيجة).</li><li><b>🎯 تابع:</b> فقاعة وحدة تتحرك ببطء. يتعلم يركّز عينه ويتابع.</li><li><b>👂 اسمع:</b> صورة وحدة والجوال يقول اسمها. يربط الصوت بالصورة.</li><li><b>👀 اختر:</b> صورتين والصوت يسأل «وين التفاحة؟». لو تأخر، الصح يلمع لحاله عشان ما يغلط.</li></ul></dd></div><div><dt>نصيحة</dt><dd>اجلس جنبه وقل الكلمة معه. لا تنتقل للمرحلة اللي بعدها إلا لما ينجح ٤ مرات من ٥ بدون مساعدة. وجلسة ٥ دقائق كافية في البداية. ${(profile.support||'mid')==='high'?'<b>ابدأ مع '+esc(profile.name)+' من مرحلة «المس».</b>':''}</dd></div></dl></article>

const fmtMin=s=>{const m=s/60;if(m<1)return AR(Math.max(1,Math.round(s)))+' ثانية';if(m<1.75)return 'دقيقة';if(m<2.5)return 'دقيقتين';const r=Math.round(m);return AR(r)+(r<=10?' دقائق':' دقيقة')};

 const tb={};LOG.ev.forEach(e=>{const k=timeBucket(new Date(e.t).getHours());tb[k]=(tb[k]||0)+e.d});
 const best=Object.entries(tb).sort((a,b)=>b[1]-a[1])[0];
 const days=[];for(let i=6;i>=0;i--){const d=new Date(now-i*864e5);d.setHours(0,0,0,0);const s=d.getTime(),e=s+864e5;days.push({l:i===0?'اليوم':DAYS[d.getDay()],m:LOG.ev.filter(x=>x.t>=s&&x.t<e).reduce((a,x)=>a+x.d,0)/60})}

 const aac=Object.entries(LOG.aac).sort((a,b)=>b[1]-a[1]);if(aac.length&&aac[0][1]>=2)out.push(['🗣️',`أكثر شي يطلبه في «كلّمني»: <b>${aac.slice(0,3).map(x=>x[0]).join('، ')}</b>. لما يطلبها لبِّها بسرعة؛ هذا يعلّمه إن الطلب أحسن من الصراخ.`]);
