name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Use the latest app page
        run: |
          python3 - <<'PY'
          import re
          s=open('web/index.html').read()
          s=re.sub(r'<link rel="manifest".*?<meta name="theme-color"[^>]*>\n','',s,flags=re.S)
          s=s.replace('<script>if("serviceWorker"','<script>if(false&&"serviceWorker"')
          open('android/app/src/main/assets/index.html','w').write(s)
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (preinstalled on the runner)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && ls $ANDROID_HOME/platforms
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/*.apk Neras.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Neras-Android-APK
          path: Neras.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: نراس - أحدث نسخة
          body: |
            📱 أندرويد: نزّل Neras.apk وثبّته.
            🍎 آيفون: Neras-unsigned.ipa يحتاج توقيع (Sideloadly أو AltStore)، أو استخدم رابط التثبيت من Safari.
          make_latest: true
          files: Neras.apk
